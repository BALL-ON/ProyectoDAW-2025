services:
  # Base de Datos
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: bd_ballon
      MYSQL_ROOT_PASSWORD: usuario
      MYSQL_USER: usuario
      MYSQL_PASSWORD: usuario
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Herramienta para gestionar la BD
  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  # Backend
  backend:
    build: ./backend
    restart: always
    ports:
      - "9999:9999"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bd_ballon
      SPRING_DATASOURCE_USERNAME: usuario
      SPRING_DATASOURCE_PASSWORD: usuario
      MAIL_USERNAME: ballontfg2026@gmail.com
      MAIL_PASSWORD: ogicejcpwyicbiyn
    depends_on:
      - db

  # Frontend
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: